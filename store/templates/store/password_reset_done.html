<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | MediMart</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
        color: #263238;
    }

    .reset-container {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        padding: 38px 32px;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
    }

    .reset-container h2 {
        text-align: center;
        color: #16834a;
        margin-bottom: 14px;
        font-size: 27px;
    }

    .reset-container p {
        text-align: center;
        color: #607078;
        line-height: 1.6;
        margin-bottom: 22px;
    }

    .reset-container form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .reset-container label {
        font-weight: 600;
        color: #37474f;
    }

    .reset-container input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cfd8dc;
        border-radius: 8px;
        font-size: 15px;
    }

    .reset-container input:focus {
        outline: none;
        border-color: #16834a;
        box-shadow: 0 0 0 3px rgba(22, 131, 74, 0.12);
    }

    .reset-container button {
        margin-top: 10px;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #16834a;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .reset-container button:hover {
        background: #106b3b;
    }

    .reset-container a {
        color: #16834a;
        text-decoration: none;
        font-weight: 600;
    }

    .reset-container a:hover {
        text-decoration: underline;
    }

    .reset-container .errorlist {
        color: #d32f2f;
        font-size: 13px;
    }

    @media (max-width: 480px) {
        .reset-container {
            padding: 28px 22px;
        }

        .reset-container h2 {
            font-size: 23px;
        }
    }
</style>
</head>
<body>
     <div class="reset-container">
    <h2>Check Your Email</h2>
    <p>
        If an active account matches the email address provided,
        you will receive instructions to reset your password.
    </p>

    </div>
</body>
</html>
